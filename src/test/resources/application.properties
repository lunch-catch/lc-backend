# Spring context integration tests do not call Kakao. These values satisfy the
# OAuth client and server-side Kakao client bean configuration without exposing
# or requiring developer credentials.
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-client-secret
kakao.app-id=test-kakao-app-id
kakao.admin-key=test-kakao-admin-key

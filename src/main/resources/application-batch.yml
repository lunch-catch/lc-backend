# 배치 서버 전용 설정. 같은 jar 를 spring.profiles.active=batch 로 띄운 서버가 읽는다.
# 배치 운영 문서 1장을 따른다
spring:
  datasource:
    hikari:
      # 앱의 8 을 그대로 쓰면 배치 두 대가 16 을 쥔다. 앱이 상한 3대로 올라간 채 배포하면
      # 앱 32 와 관리 3 을 더해 51 이 되어 RDS 안전선 48 을 넘는다 (lc-infra 의 오토스케일링 설계 3장).
      #
      # 5 는 아래 스케줄러 스레드 4 에 액추에이터 헬스체크 1 을 더한 값이다. 배치의 DB 작업은 전부
      # 스케줄러 스레드에서 돌고 스레드마다 한 번에 커넥션 하나를 쓴다. 00:00 묶음도 트랜잭션으로 감싸지
      # 않아 단계를 차례로 돌며 하나씩 빌린다.
      #
      # 스레드 수보다 작게 두면 안 된다. 묶음이 커넥션을 쥔 동안 생존 신호가 connection-timeout 3초에
      # 걸려 실패하고, 갱신이 멈춘 행을 다른 서버가 빼앗는다. 단계 구현이 REQUIRES_NEW 를 쓰게 되면
      # 그 스레드가 둘을 쥐므로 다시 센다.
      #
      # 평소에는 생존 신호와 이어받기만 돌아 1 이면 된다
      maximum-pool-size: 5
      minimum-idle: 1
  task:
    scheduling:
      pool:
        # 1 로 두면 00:00 묶음이 도는 동안 생존 신호가 한 번도 못 돈다.
        # 그러면 멀쩡히 일하는 서버의 행이 2분 뒤 멈춘 것으로 보여 다른 서버가 빼앗는다.
        # 묶음, 생존 신호, 이어받기 셋이 동시에 떠도 남도록 넷을 둔다
        size: 4

launchcatch:
  scheduler:
    # 스케줄러를 켜는 곳은 여기뿐이다. 기본 프로필에는 이 값이 없어 앱 인스턴스는 꺼진 상태다.
    #
    # 장애 대응 중에는 프로필을 그대로 두고 환경변수 LAUNCHCATCH_SCHEDULER_ENABLED=false 로 끈다.
    # 환경변수가 프로필 설정보다 우선이라 재배포 없이 멈춘다
    enabled: true

  batch:
    # 배치 서버의 식별자다. batch_execution_log.owner_id 로 들어간다.
    #
    # 주지 않으면 BatchServerId 가 호스트 이름에 임의 접미사를 붙여 프로세스마다 다르게 만든다.
    # 값을 줄 거면 서버마다 서로 달라야 한다. 두 서버가 같은 값을 쓰면 살아 있는 서버의 생존
    # 신호가 죽은 서버의 행까지 갱신하고, 이어받기는 "내 것이 아닌 행" 만 찾으므로 그 행을
    # 영원히 가져오지 않는다
    owner-id: "${LAUNCHCATCH_BATCH_OWNER_ID:}"

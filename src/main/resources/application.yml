spring:
  application:
    name: launchcatch

  profiles:
    # 아무도 프로필을 지정하지 않으면 local 로 본다. 배포와 테스트는 프로필을 직접 주므로 이 값이 덮인다
    default: local

  # 아래 셋은 환경마다 갈린다. 값을 주지 않으면 compose.yaml 의 기본 구성에 맞는다.
  # bootRun 은 spring-boot-docker-compose 가 띄운 컨테이너에서 읽어낸 값이 이 셋을 덮는다
  datasource:
    # 드라이버 옵션을 URL 에 붙이지 않는다. 아래 data-source-properties 가 갖는다.
    # 여기 적으면 DB_URL 이 주입되는 환경에서 콜론 뒤가 통째로 버려져 로컬에서만 적용된다
    url: "${DB_URL:jdbc:mysql://localhost:3306/launchcatch}"
    username: "${DB_USERNAME:launchcatch}"
    password: "${DB_PASSWORD:launchcatch}"
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # 이름이 비슷한 값이 여럿이라 각각 무엇을 재는지 먼저 적는다.
      #
      #   connection-timeout   Hikari.  풀에 커넥션을 달라고 하고 받기까지 기다리는 상한
      #   validation-timeout   Hikari.  빌려주기 전에 그 커넥션이 살아 있는지 확인하는 상한
      #   keepalive-time       Hikari.  노는 커넥션을 이 주기로 찔러 살아 있는지 본다
      #   max-lifetime         Hikari.  이만큼 산 커넥션은 닫고 새것으로 바꾼다
      #   connectTimeout       JDBC.    커넥션을 새로 세우는 상한. TCP 핸드셰이크와 MySQL 인증
      #   socketTimeout        JDBC.    세워진 커넥션에서 서버가 보낸 바이트를 기다리는 상한
      #
      # 앞의 넷은 Hikari 가 자기 풀에 걸고 뒤의 둘은 드라이버가 소켓에 건다. 층이 다르다.
      #
      # 드라이버 쪽 둘은 기본값이 0, 곧 무제한이다. 안 걸면 조용히 끊긴 연결을 영영 기다린다.
      # 그래서 이 둘은 값을 고르는 것이 아니라 반드시 걸어야 하는 것이다.
      #
      # socketTimeout 은 쿼리 실행 시간 제한이 아니다. 읽기 한 번마다 재는 값이라 결과가 패킷
      # 여러 번에 나눠 오면 그 사이마다 시계가 다시 시작한다. 그리고 여기서 포기해도 서버 쪽
      # 쿼리는 계속 돈다. 클라이언트가 기다리기를 그만두는 것뿐이다.
      #
      # Hikari 는 connection-timeout 과 validation-timeout 에 하한 250ms 를 강제한다. 그보다
      # 작게 적으면 경고 로그와 함께 250 으로 덮어써서 적힌 값과 도는 값이 갈린다.
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 120000
      # MySQL wait_timeout 보다 짧아야 죽은 커넥션을 잡는다
      max-lifetime: 1500000
      # 인스턴스 수와 DB 사양이 정해지면 다시 잡는다. 안쪽(풀)이 더 작아야 톰캣 스레드가
      # DB 를 기다리다 고갈되지 않는다. 최소를 최대와 같게 두지 않는 이유는, 새로 뜬 인스턴스가
      # 요청 하나 받기 전에 최대치를 먼저 잡아 가장 빡빡한 순간에 노는 커넥션이 생기기 때문이다
      maximum-pool-size: 8
      minimum-idle: 2
      # URL 에 붙이지 않고 여기서 준다. 어떤 URL 이 와도 값이 유지된다
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 10000
        # 선착순 발급이 JDBC 배치로 기록한다. 드라이버가 건별 INSERT 로 풀어 보내면
        # 그 왕복이 그대로 병목이 된다. 전용 프로파일에만 넣으면 테스트와 운영이 서로 다른
        # 실패 모양을 보게 되어 그 분기를 검증할 수 없으므로 여기 둔다
        rewriteBatchedStatements: true
        characterEncoding: UTF-8
        # 드라이버와 DB 세션 시간대를 Asia/Seoul 로 맞춘다.
        # forceConnectionTimeZoneToSession 이 세션 쪽까지 바꾼다
        connectionTimeZone: Asia/Seoul
        forceConnectionTimeZoneToSession: true

  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 는 어긋나면 기동을 막는 역할만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 마이그레이션은 FlywayConfig 가 도메인마다 따로 돌린다 (설계 문서 1.3절).
  # 자동 설정을 켜면 db/migration 전체를 한 번에 훑어 버전 1 이 도메인 수만큼 걸려 멈춘다.
  # 그래서 baseline 같은 나머지 설정도 여기가 아니라 그 코드에 있다
  flyway:
    enabled: false

  # Refresh Token 회전과 Access Token valid-after 커트라인, 선착순 순번,
  # serve 기록, 당일 소진 카운터가 이 캐시를 쓴다.
  # 엔진은 Valkey 이고 프로토콜이 같아 spring.data.redis 설정을 그대로 쓴다 (compose.yaml 참고).
  # 변수명을 compose 와 맞춘다. 한쪽만 바꾸면 컨테이너와 앱이 서로 다른 포트를 본다
  data:
    redis:
      host: "${VALKEY_HOST:localhost}"
      port: "${VALKEY_PORT:6379}"
      # 인증 경로가 요청마다 이 캐시를 찌른다.
      # 값을 주지 않으면 Lettuce 기본이 커맨드 60초, 연결 10초라 캐시가 죽는 게 아니라
      # 느려지기만 해도 톰캣 스레드가 그만큼 묶인다. DB 쪽은 socketTimeout 으로 이미 막았다.
      #
      # 단일 GET/SET/INCR 이고 같은 네트워크 안이라 정상 지연은 1밀리초 아래다.
      # 1초는 그 1000배라 정상 요청을 자를 여지가 없으면서 스레드 점유를 끊는다
      timeout: 1s
      connect-timeout: 1s

  security:
    oauth2:
      client:
        registration:
          # 사용자 로그인
          kakao:
            client-id: "${KAKAO_CLIENT_ID}"
            client-secret: "${KAKAO_CLIENT_SECRET}"
            authorization-grant-type: authorization_code
            redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback}"
            scope: openid,profile_nickname,profile_image
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 처리 중인 요청을 마치고 내려간다. 대상 그룹 해제 지연과 짝을 이룬다
  shutdown: graceful
  tomcat:
    threads:
      max: 200

# 액추에이터를 8081 로 분리한다.
# 8080 에 /actuator 경로가 존재하지 않게 되어 밖에서 막을 규칙이 필요 없다.
management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      # liveness 와 readiness 를 나눈다. 기동 중인 앱은 살아 있지만 준비되지 않았다
      probes:
        enabled: true
      # 밖에서 볼 수 있으므로 상세를 숨긴다
      show-details: never
      group:
        # 공유 의존성을 넣지 않는다.
        # DB 가 흔들리면 전 인스턴스가 동시에 대상 그룹에서 빠져 서비스가 통째로 끊긴다
        readiness:
          include: diskSpace

  metrics:
    tags:
      application: "${APP_NAME:launchcatch}"
      instance: "${APP_INSTANCE_ID:local}"

  tracing:
    sampling:
      probability: "${TRACE_SAMPLE_RATE:0.1}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

# 이미지 URL 앞에 붙는 주소다. 운영은 CloudFront 도메인이 들어온다.
#
# 기본값을 비워 둔다. 로컬에는 오브젝트 스토리지가 없어 어차피 이미지가 열리지 않는데,
# 여기에 localhost 를 적어 두면 운영에서 값이 빠졌을 때 그 주소가 응답에 실려 나간다
cdn:
  base-url: "${CDN_BASE_URL:}"

# 가게 이미지와 대표 메뉴, 포스터 이미지, 증빙 서류가 쓰는 버킷.
# presigned PUT 발급과 HeadObject 확인에 쓰인다
s3:
  region: "${S3_REGION:ap-northeast-2}"
  media-bucket: "${S3_MEDIA_BUCKET:}"
  # 증빙 서류는 10분 이하로 둔다. 600초가 그 상한이다
  presigned-url-expiry-seconds: "${S3_PRESIGNED_URL_EXPIRY_SECONDS:600}"

jwt:
  secret: "${JWT_SECRET}"
  # Access 는 세 역할이 모두 30분이고 Refresh 만 역할마다 다르다
  access-token-validity-ms: "${JWT_ACCESS_VALIDITY_MS:1800000}"
  refresh:
    # 관리자 1일
    admin-validity-ms: "${JWT_REFRESH_ADMIN_VALIDITY_MS:86400000}"
    # 점주 14일
    owner-validity-ms: "${JWT_REFRESH_OWNER_VALIDITY_MS:1209600000}"
    # 사용자 14일. 회원 Refresh Token은 항상 persistent cookie로 발급한다
    member-validity-ms: "${JWT_REFRESH_MEMBER_VALIDITY_MS:1209600000}"
  cookie:
    secure: "${JWT_COOKIE_SECURE:false}"

kakao:
  app-id: "${KAKAO_APP_ID}"
  admin-key: "${KAKAO_ADMIN_KEY}"

# 카카오 OIDC 외부 API(토큰교환, 로그아웃, 연결 해제) 서킷브레이커.
# 인스턴스를 API 별로 나눈다. 하나가 막혀도 다른 API 까지 같이 막히지 않는다.
# config 는 트래픽 양에 따라 두 종류로 나눈다. 값만 공유할 뿐 상태(open/closed)는
# 인스턴스별로 독립이다. 이름을 하나로 합치지 않는 한 세 서킷은 절대 같이 안 열린다.
#
# 토큰교환은 트래픽이 꾸준해 60초에 5회가 쉽게 채워지지만, 연결 해제와 로그아웃은
# 사용자 행동 기반이라 60초 창에 5통이 쌓이는 일 자체가 드물다. 그러면 5xx 가 반복돼도
# minimumNumberOfCalls 를 못 채워 failureRateThreshold 가 영영 계산되지 않고 서킷이
# 열리지 않는다. 그래서 그 둘은 창을 5분으로 늘리고 최소 호출을 3으로 낮춘 쪽을 쓴다
resilience4j:
  circuitbreaker:
    configs:
      kakao-common:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 60
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        # WebClientConfig 의 connect timeout 과 맞춘 기준
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        maxWaitDurationInHalfOpenState: 5s
        # 트래픽이 뜸한 API 라 백그라운드 스레드로 자동 전환할 필요가 없다.
        # waitDuration 이 지난 뒤 다음 실제 요청이 half-open 전환 여부를 판단한다
        automaticTransitionFromOpenToHalfOpenEnabled: false
        # /actuator/health 에 묶지 않는다.
        # 카카오 장애는 우리 배포나 DB 와 무관한 제3자 장애라, 이걸로 health 를 DOWN 시키면
        # 배포 스모크나 로드 밸런서가 엉뚱하게 반응한다. 상태 확인은 Prometheus 로 한다
        registerHealthIndicator: false
        eventConsumerBufferSize: 100
      kakao-low-traffic:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 300
        minimumNumberOfCalls: 3
        # 호출 자체가 뜸해서 임계값이 낮으면 소수 실패로 회로가 오탐으로 열린다.
        # 최근 3회가 전부 실패했을 때만 OPEN 으로 간다
        failureRateThreshold: 100
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        maxWaitDurationInHalfOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: false
        registerHealthIndicator: false
        eventConsumerBufferSize: 100
    instances:
      kakaoLogin:
        base-config: kakao-common
      kakaoLogout:
        base-config: kakao-low-traffic
      kakaoUnlink:
        base-config: kakao-low-traffic

      # 선착순 발급과 노출 차감의 회로는 여기 더한다.
      #
      # 값을 미리 적지 않는다. 창을 건수 기준으로 두면 유입이 빠를수록 판정 근거의 시간 폭이
      # 좁아져 GC 정지 하나가 창을 통째로 덮는다. 그래서 시간 기준 창과 느림 문턱을 쓰는데,
      # 그 문턱은 자기 앱의 지연 분포를 알아야 정할 수 있다.
      # 목표 처리량으로 부하 시험을 돌린 뒤 실측으로 채운다


        이 파일 하나로는 답할 수 없다.

        시간대 관련 설정은 Asia/Seoul 고정이다. UTC 로 바꾸면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [qa-reliability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-reliability-guideline.md)

        - `REL-2-03` DB 커넥션 획득과 쿼리 실행에도 타임아웃이 있는가
        - `REL-2-09` 실패율이 임계치를 넘으면 호출을 끊고 빠르게 실패하는가
        - `REL-5-02` 기동 완료 전에 트래픽을 받지 않는가 (readiness와 liveness 분리)
        - `REL-5-03` 종료 시 처리 중인 요청을 마치고 내려가는가 (graceful shutdown)
        - `REL-5-04` liveness가 외부 의존성 상태에 좌우되지 않는가

        근거 [qa-security-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-security-guideline.md)

        - `SEC-3-05` 요청 본문 크기 상한이 설정되어 있는가


# CodeRabbit 자동 코드 리뷰 설정.
#
# 판정 기준은 이 파일이 아니라 docs/code-convention 이 갖는다. 진입점은 그 디렉터리의
# CODEREVIEW.md 다. 이 파일은 그 규약을 CodeRabbit 에 전달하는 배선일 뿐이다.
# 규칙을 바꿀 때는 가이드 문서를 먼저 고친다.
#
# 스키마: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# CODEREVIEW.md 봇 규칙 7. 모든 리뷰 코멘트는 한국어로 작성한다
language: ko-KR

# 250자 상한이 있어 핵심만 적는다. 나머지는 아래 path_instructions 의 공통 항목에 있다
tone_instructions: >-
  제목, 본문, 근거, 인용까지 모든 문장을 한국어로 쓴다. 가이드 문장을 영어로 옮기지 않고
  한국어 원문을 그대로 인용한다. 지적마다 [BLOCKER], [MAJOR], [MINOR], [NIT] 를 앞에 붙인다.
  코드 식별자와 애너테이션, 파일 경로, 규칙 번호는 원문 그대로 둔다.

reviews:
  # 균형 잡힌 쪽. CODEREVIEW.md 가 "지적이 과도하게 많으면 BLOCKER 와 MAJOR 부터 정리해서
  # 전달한다" 고 적은 것과 같은 방향이다. 더 깐깐하게 보려면 assertive 로 올린다
  profile: chill

  # 병합을 막는 게이트는 G-BUILD 하나뿐이다 (build-gate-guideline.md).
  # LLM 판정은 재현율이 측정되지 않았으므로 차단하지 않고 지적만 남긴다.
  # 오탐으로 병합이 막히기 시작하면 우회 문화가 생긴다
  request_changes_workflow: false

  # 기본값이 true 라 리뷰 진행 상태가 커밋 상태로 남는다. 그것이 브랜치 보호에서
  # 필수 체크로 걸리는 순간 위 결정이 무너지므로 애초에 만들지 않는다.
  # 리뷰 상태를 체크로 보고 싶으면 true 로 올리고, 대신 필수 체크로 걸지 않는다
  commit_status: false
  fail_commit_status: false

  high_level_summary: true

  # 워크스루 표의 설명 문장이 영어로 나오던 것을 막는다
  high_level_summary_instructions: >-
    한국어로 쓴다. 무엇을 바꿨는지와 왜 바꿨는지를 각각 한 문장으로 적고,
    클래스명과 패키지명은 원문 그대로 둔다. 릴리스 노트 문투를 쓰지 않는다.
  review_status: true
  collapse_walkthrough: true
  abort_on_close: true

  # 피드와 노출 과금처럼 흐름이 긴 변경에서 도움이 된다
  sequence_diagrams: true
  estimate_code_review_effort: true

  # 리뷰 코멘트에 시 같은 장식을 넣지 않는다
  poem: false

  pre_merge_checks:
    # 기본값이 warning 에 임계 80% 다. 측정 대상에 한글 이름 테스트 메서드가 함께 들어가
    # 어떤 PR 이든 임계를 넘지 못하고, 넘기려면 테스트마다 Javadoc 을 달아야 한다.
    # 사전 점검은 차단하지 않지만 매번 뜨는 경고는 나머지 점검의 신호를 묻는다
    docstrings:
      # YAML 1.1 이 따옴표 없는 off 를 boolean false 로 읽어 스키마 검증에서 떨어진다
      mode: "off"

  auto_review:
    enabled: true
    # 초안에는 돌지 않는다. 작성 중인 PR 에 지적이 쌓이면 읽지 않게 된다
    drafts: false
    # 이 목록은 "기본 브랜치 외에" 리뷰할 base 를 적는 곳이다. 기본 브랜치(main)는
    # 목록과 무관하게 항상 리뷰되므로 여기에 적지 않는다.
    # 적지 않은 base 의 PR 은 자동 리뷰에서 빠진다. develop 을 빼면 기능 브랜치가
    # 리뷰 없이 develop 에 들어가고, main 으로 가는 PR 하나에만 리뷰가 몰린다.
    base_branches:
      - develop
    auto_incremental_review: true

  path_filters:
    # 생성물과 래퍼는 사람이 고치는 코드가 아니다
    - "!build/**"
    - "!gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!.gradle/**"

  path_instructions:
    # --- 모든 파일에 적용되는 봇 규칙 (CODEREVIEW.md "봇 동작 규칙") -----------------
    - path: "**"
      instructions: |
        모든 문장을 한국어로 쓴다. 요약, 워크스루, 지적, 근거, 인용이 모두 대상이다.
        가이드와 설계 문서의 문장을 영어로 번역해 인용하지 않는다. 한국어 원문을 그대로 옮기고
        어느 항목인지 번호로 가리킨다. 예를 들어 "Admin must not depend on other business
        domains" 가 아니라 "관리자는 다른 업무 도메인을 의존하지 않는다(설계 문서 2.2절)" 로 쓴다.

        판정 기준은 docs/code-convention 과 docs/software-quality 의 *-guideline.md 에 적힌
        점검 항목으로 한정한다. 가이드에 없는 항목은 지적하지 않는다. 새 기준이 필요하면
        가이드를 먼저 고치라고 제안한다.
        *-rationale.md 는 설명을 보강할 때만 참고하고, 그것을 근거로 새 지적을 만들지 않는다.

        docs/software-quality 의 항목에는 층위 표기가 붙어 있다. 기본은 `[코드]` 만 쓴다.
        `[설계]` 와 `[인프라]` 는 아래 경로 지시가 항목 번호를 직접 열거한 경우에만 쓴다.
        파일 하나로 판정되는 항목만 열어 두었다. 열거되지 않은 번호로는 지적하지 않고,
        필요하면 사람이 볼 사안이라고만 한 줄 적는다.
        `[프로세스]` 는 어느 경로에서도 쓰지 않는다. 기록을 봐야 판정되기 때문이다.

        품질 속성 가이드의 수치에는 등급이 붙어 있다. 등급 C 는 근거 없이 정한 예시값이므로
        그 수치를 어겼다고 지적하지 않는다. 설정이 있는지 없는지는 보되 값의 적정성은 보지 않는다.

        지적마다 근거를 아래 모양으로 붙인다. 형식을 지킨다.

        문서별로 묶는다. 문서 이름을 링크로 걸고 그 문서의 항목만 목록으로 나열한다.
        전체 경로를 본문에 적지 않는다. 링크 주소에만 둔다.

          근거 [entity-creation-guideline.md](링크)

          - `EC-1-01` 엔티티에 `@Setter`, `@Data`가 붙어 있지 않은가
          - `EC-1-02` 클래스 레벨 `@Builder`, `@AllArgsConstructor`가 없는가

        문서가 둘 이상이면 묶음을 반복한다. 목록 앞뒤에 빈 줄을 둔다.
        빈 줄이 없으면 마크다운이 줄을 합쳐 한 덩어리로 보인다.

        항목 내용은 가이드 문서의 문장을 그대로 옮긴다. 요약하거나 번역하거나 고쳐 쓰지 않는다.
        번호와 문서를 추측하지 않는다. 가이드에서 찾지 못하면 그 지적을 만들지 않는다.

        경로 지시가 항목을 나열해 둔 경우는 그 번호와 문장을 쓴다.
        목록에 없는 항목으로 지적할 때는 가이드에서 번호와 문서를 찾아 같은 모양으로 쓴다.
        저장소 이름은 lc-backend 다.

        한 사안은 한 번만 지적한다. 여러 가이드가 같은 문제를 다룰 때는 CODEREVIEW.md 의
        "중복 지적 방지 소유권 우선순위" 표에 따라 그 사안을 소유한 가이드 하나만 기준으로 쓴다.
        더 구체적이고 좁은 범위를 다루는 가이드가 소유한다.

        가이드가 다루지 않는 사안(트랜잭션 경계, 잠금 전략, N+1 과 인덱스, 인가와 소유권 검증,
        타임아웃과 서킷 브레이커, 엔티티 뼈대와 식별자 전략)은 지적하지 않는다. 사람 리뷰어의 몫이다.

        외부 링크와 출처(AIP 번호, 책 항목 번호, URL)는 사람을 위한 참고다. 가져오지 말고
        가이드 본문에 적힌 내용만으로 판단한다. 확인이 필요하면 그 사실을 코멘트로 남겨 사람에게 넘긴다.

        문서와 주석에 em dash 와 middle dot 을 쓰지 않는다. 화살표는 -> 와 <- 로 쓴다 (CLAUDE.md).

    # --- 프로덕션 자바 전체 -----------------------------------------------------
    - path: "src/main/java/**/*.java"
      instructions: |
        effective-java-guideline.md(EJ-)를 변경 위치와 무관하게 적용한다.
        domain-boundary-guideline.md(DPB-)를 함께 적용한다.
        다른 도메인의 entity 와 repository 를 직접 참조하지 않는지(DPB-2-01), 도메인 간 호출이
        상대 도메인의 contract 인터페이스를 지나는지(DPB-2-03) 본다. 의존 방향은 설계 문서
        2.2절 그래프를 따르고, 오른쪽에서 왼쪽으로 가는 새 간선은 순환 후보다(DPB-4-01).
        WebClient.builder() 를 직접 부르지 않는지 본다. 공통 타임아웃과 풀 설정을 우회한다.

        품질 속성에서는 아래 셋의 [코드] 항목을 함께 본다.
        qa-security-guideline.md(SEC-): 쿼리를 문자열로 조립하지 않는지(SEC-2-01), 정렬 컬럼처럼
        바인딩할 수 없는 값을 허용 목록으로 걸렀는지(SEC-2-02), 외부 입력을 서버에서
        검증하는지(SEC-3-01), 비밀값을 코드에 박지 않았는지 본다.
        qa-maintainability-guideline.md(MNT-): 한 메서드가 한 가지 일을 하는지, 분기 깊이가
        과하지 않은지, 설정값을 하드코딩하지 않았는지 본다.
        qa-observability-guideline.md(OBS-): 개인정보와 토큰이 로그에 남지 않는지(OBS-3-04),
        로그 레벨이 의미에 맞는지(OBS-3-03), 예외에 원인을 찾을 식별자가 있는지(OBS-7-01) 본다.
        상관관계 ID 는 MdcLoggingFilter 가 넣으므로 새로 만들라고 하지 않는다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [effective-java-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/effective-java-guideline.md)

        - `EJ-1-01` 생성자 대신 정적 팩터리 메서드라는 선택지를 검토했는가 (아이템 1)
        - `EJ-3-01` 접근 제어자를 최소한으로 두어 캡슐화했는가 (아이템 15)
        - `EJ-3-03` 가변성을 최소화했는가, 가능하면 불변 객체로 두었는가 (아이템 17)
        - `EJ-3-05` 상속을 의도하지 않은 클래스는 확장을 금지했는가 (아이템 19)
        - `EJ-7-01` 파라미터 유효성을 메서드 시작 부분에서 검사하는가 (아이템 49)
        - `EJ-7-03` null 대신 빈 컬렉션이나 빈 배열을 반환하는가 (아이템 54)
        - `EJ-8-04` 정확한 계산에 float, double 대신 BigDecimal이나 정수형을 썼는가 (아이템 60)
        - `EJ-9-01` 예외를 흐름 제어 수단으로 쓰지 않는가 (아이템 69)
        - `EJ-9-04` 표준 예외를 우선 활용했는가 (아이템 72)
        - `EJ-9-06` 예외를 무시하지 않는가 (아이템 77)

        근거 [qa-security-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-security-guideline.md)

        - `SEC-2-01` 쿼리를 문자열 연결로 조립하지 않는가
        - `SEC-2-02` 정렬 컬럼, 테이블명 등 바인딩 불가 요소를 화이트리스트로 검증하는가
        - `SEC-3-01` 모든 외부 입력을 서버에서 검증하는가

        근거 [qa-observability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-observability-guideline.md)

        - `OBS-3-03` 로그 레벨이 의미에 맞게 쓰이는가
        - `OBS-3-04` 개인정보와 인증 토큰이 남지 않는가
        - `OBS-7-01` 예외에 원인 추적에 필요한 식별자가 포함되는가

        근거 [qa-maintainability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-maintainability-guideline.md)

        - `MNT-3-02` 매직 넘버가 상수로 분리되어 있는가
        - `MNT-4-01` 이름이 역할을 드러내는가
        - `MNT-4-03` 예외가 스택과 함께 남는가
        - `MNT-4-04` 예외를 삼키지 않는가

    - path: "src/main/java/**/service/**/*.java"
      instructions: |
        qa-data-integrity-guideline.md(DI-)의 [코드] 항목을 적용한다. 트랜잭션 범위가 업무
        단위와 맞는지(DI-4-01), 트랜잭션 안에서 외부 API 를 호출하지 않는지(DI-4-02),
        트랜잭션이 필요 이상으로 길지 않은지(DI-4-03) 본다. 수량을 깎는 흐름이면 잠금이
        있는지(DI-2-01)와 획득 순서가 일정한지(DI-2-03) 본다.

        qa-reliability-guideline.md(REL-)의 [코드] 항목을 적용한다. 외부 호출에 연결과 읽기
        타임아웃이 있는지(REL-2-01), 재시도하는 연산이 멱등한지(REL-2-04), 재시도에 지수
        백오프와 상한이 있는지(REL-2-06, REL-2-07) 본다. 구체적인 초값은 application.yml 과
        그 주석이 정하므로 값의 적정성은 지적하지 않는다.

        qa-performance-efficiency-guideline.md(PERF-)의 [코드] 항목을 적용한다. 반복문 안에서
        연관 엔티티에 접근하지 않는지(PERF-2-01), 목록 조회에서 건별 집계를 반복하지
        않는지(PERF-2-02) 본다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [qa-data-integrity-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-data-integrity-guideline.md)

        - `DI-2-01` 갱신 손실 가능성이 있는 흐름에 잠금을 적용했는가
        - `DI-2-03` 잠금 획득 순서가 일정해 교착 상태(deadlock)를 유발하지 않는가
        - `DI-4-01` 트랜잭션 범위가 비즈니스 단위와 일치하는가
        - `DI-4-02` 트랜잭션 안에서 외부 API를 호출하지 않는가
        - `DI-4-03` 트랜잭션이 필요 이상으로 길지 않은가

        근거 [qa-reliability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-reliability-guideline.md)

        - `REL-2-01` 모든 외부 호출에 연결 타임아웃과 읽기 타임아웃이 설정되어 있는가
        - `REL-2-04` 재시도 대상 연산이 멱등한가
        - `REL-2-06` 재시도 간격에 지수 백오프와 지터를 적용했는가
        - `REL-2-07` 재시도 횟수에 상한이 있는가

        근거 [qa-performance-efficiency-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-performance-efficiency-guideline.md)

        - `PERF-2-01` 컬렉션 조회 후 루프에서 연관 엔티티에 접근하지 않는가 (N+1)
        - `PERF-2-02` 목록 조회에서 건별 집계 쿼리를 반복하지 않는가

        근거 [qa-maintainability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-maintainability-guideline.md)

        - `MNT-2-02` 외부 의존성이 구현체가 아니라 추상화에 의존하는가
        - `MNT-2-03` 시간, 랜덤, 현재 사용자 같은 암묵적 의존이 주입 가능한가

        근거 [domain-boundary-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/domain-boundary-guideline.md)

        - `DPB-2-03` 다른 도메인의 데이터를 그 도메인이 공개한 `contract` 로만 다루는가

    # --- 엔티티 ---------------------------------------------------------------
    - path: "src/main/java/**/entity/**/*.java"
      instructions: |
        entity-creation-guideline.md(EC-)와 jpa-association-guideline.md(AGG-)를 적용한다.
        생성 경로는 EC- 가 보고, 연관 필드가 무엇을 가리키는지는 AGG- 가 본다.
        다른 도메인 엔티티를 객체로 참조하지 않고 ID 필드로 두었는지(AGG-1-01),
        @ManyToOne 과 @OneToOne 에 fetch = LAZY 를 명시했는지(AGG-4-01),
        cascade 가 애그리거트 경계를 넘지 않는지(AGG-4-04) 본다.
        시각 컬럼은 global.entity 의 BaseTimeEntity 를 상속해 얻는다. 직접 선언하면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [entity-creation-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/entity-creation-guideline.md)

        - `EC-1-01` 엔티티에 `@Setter`, `@Data`가 붙어 있지 않은가
        - `EC-1-02` 클래스 레벨 `@Builder`, `@AllArgsConstructor`가 없는가
        - `EC-1-03` `@EqualsAndHashCode`, `@ToString`이 연관 필드를 포함하지 않는가
        - `EC-2-01` `@NoArgsConstructor(access = AccessLevel.PROTECTED)`가 있는가
        - `EC-2-03` public 생성자 또는 필수를 받지 않는 public `builder()`가 있는가
        - `EC-2-05` `id`를 외부에서 세팅할 수 있는가
        - `EC-2-07` 필수 필드 검증이 private 생성자에 있는가
        - `EC-2-09` 필수 필드가 팩터리 파라미터로 컴파일 시점에 강제되는가
        - `EC-2-12` 세 애너테이션이 엔티티에 없는가
        - `EC-2-13` 상태 변경이 setter가 아니라 도메인 메서드로 이루어지는가
        - `EC-3-04` `@EqualsAndHashCode`를 쓰지 않고 직접 작성했는가
        - `EC-4-02` `@Enumerated(EnumType.STRING)`을 명시했는가

        근거 [jpa-association-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/jpa-association-guideline.md)

        - `AGG-1-01` 다른 도메인 엔티티를 객체로 참조하지 않고 ID 필드로 두었는가
        - `AGG-4-01` `@ManyToOne` 과 `@OneToOne` 에 `fetch = FetchType.LAZY` 를 명시했는가
        - `AGG-4-04` `cascade` 가 애그리거트 경계를 넘지 않는가

    - path: "src/main/java/**/repository/**/*.java"
      instructions: |
        jpa-association-guideline.md(AGG-)를 적용한다. 저장소를 애그리거트 루트에만 두었는지
        (AGG-3-03), 여러 건을 읽을 때 ID 목록으로 한 번에 받는지(AGG-1-03) 본다.
        네이티브 쿼리 문자열 안에 다른 도메인의 테이블 이름이 들어가면 지적한다.
        정적 분석이 잡지 못하는 자리라 리뷰가 유일한 방어선이다.

        qa-performance-efficiency-guideline.md(PERF-)의 [코드] 항목을 함께 본다.
        N+1 을 만드는 조회가 아닌지(PERF-2-01), 전체를 읽어 메모리에서 거르지 않는지 본다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [jpa-association-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/jpa-association-guideline.md)

        - `AGG-1-03` 여러 건을 읽을 때 ID 목록으로 한 번에 받는 메서드를 쓰는가
        - `AGG-3-03` 저장소를 애그리거트 루트에만 두었는가

        근거 [qa-performance-efficiency-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-performance-efficiency-guideline.md)

        - `PERF-2-01` 컬렉션 조회 후 루프에서 연관 엔티티에 접근하지 않는가 (N+1)

    # --- 도메인 간 계약 --------------------------------------------------------
    - path: "src/main/java/**/contract/**/*.java"
      instructions: |
        domain-boundary-guideline.md 의 DPB-1-02 와 DPB-1-03 을 적용한다.
        contract 에는 인터페이스와 record, enum 만 둔다.
        로직이 있으면 구현을 같은 도메인의 service 로 내리라고 제안한다.
        엔티티와 저장소를 드러내지 않는지 본다(AGG-4-05). 주고받는 타입은 record 다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [domain-boundary-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/domain-boundary-guideline.md)

        - `DPB-1-01` 공개할 것을 `{도메인}/contract/` 에 두고 나머지를 계층 폴더에 두었는가
        - `DPB-1-02` `contract` 에 인터페이스와 record, enum 만 두었는가
        - `DPB-1-03` `contract` 가 `entity` 와 `repository` 를 참조하지 않는가

    - path: "src/main/java/**/*Event.java"
      instructions: |
        domain-boundary-guideline.md 의 DPB-4-03 과 DPB-4-04 를 적용한다.
        이벤트 타입은 발행 도메인의 contract 패키지에 둔다.
        페이로드에 식별자와 값만 싣고 엔티티를 싣지 않는다.
        새 이벤트를 만들면 설계 문서 2.4절의 표와 ArchitectureTest 의 EVENT_HOME 목록을
        함께 고쳤는지 확인한다. 한쪽만 고치면 문서와 테스트가 어긋난다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [domain-boundary-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/domain-boundary-guideline.md)

        - `DPB-4-03` 이벤트 타입을 발행 도메인의 `contract` 에 두었는가
        - `DPB-4-04` 새 이벤트를 만들 때 2.4절 표와 `ArchitectureTest.EVENT_HOME` 을 함께 고쳤는가

    # --- API 표면 -------------------------------------------------------------
    - path: "src/main/java/**/controller/**/*.java"
      instructions: |
        api-design-guideline.md(API-)와 docs/api-spec/README.md 의 공통 규약을 적용한다.
        경로가 소비자별로 갈리는지(/v1, /v1/owner, /v1/admin), 리소스가 명사 복수형인지,
        표준 메서드로 되는 것을 콜론 커스텀 메서드로 만들지 않았는지 본다.
        응답은 ResponseEnvelope 로 감싸고 상태 코드는 ErrorCode 가 들고 있는 값을 쓴다.
        목록은 pageSize 와 pageToken 커서 방식이고 정렬 키는 허용 목록으로 검증한다.
        토큰은 쿠키로만 오간다. Authorization 헤더를 읽거나 응답 본문에 토큰을 실으면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [api-design-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/api-design-guideline.md)

        - `API-2-03` 리소스 이름이 계층을 드러내는 경로 형식인가
        - `API-3-01` 표준 메서드(Get, List, Create, Update, Delete)로 표현 가능한 동작을 커스텀으로 만들지 않았는가
        - `API-3-04` List는 페이지네이션을 제공하는가
        - `API-3-05` Create는 부모 컬렉션에 대해 수행하고 생성된 리소스를 반환하는가
        - `API-3-08` 커스텀 메서드는 표준 HTTP 동사(주로 POST)에 콜론 표기로 동사를 붙였는가
        - `API-4-03` 필드 이름이 동사가 아니라 명사인가
        - `API-4-04` 반복 필드는 복수형, 단일 필드는 단수형인가
        - `API-5-01` 컬렉션 반환은 처음부터 페이지네이션을 넣었는가
        - `API-7-03` 오류 응답이 표준 구조와 표준 코드를 따르는가
        - `API-7-04` 오류 메시지가 간결하면서 해결 방향을 제시하고, 내부 구현이나 민감 정보를 노출하지 않는가

        근거 [qa-maintainability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-maintainability-guideline.md)

        - `MNT-2-01` Controller에 비즈니스 로직이 없는가

    - path: "src/main/java/**/global/exception/**/*.java"
      instructions: |
        response-exception-flow.md 를 적용한다. 도메인 오류 코드를 CommonErrorCode 에 넣지 않는다.
        오류 문구는 ErrorCode 에서만 나온다. 던지는 자리에서 문장을 지어내면 지적한다.
        도메인마다 예외 클래스 하나와 오류 코드 enum 하나를 두고, 실패 종류마다 클래스를 만들지 않는다.

    # --- 인증 ----------------------------------------------------------------
    - path: "src/main/java/**/auth/**/*.java"
      instructions: |
        docs/api-spec/README.md 의 인증 절을 기준으로 본다.
        Access 는 JWT 30분, Refresh 는 Opaque 이고 역할마다 수명이 다르다(관리자 1일, 점주와
        사용자 14일). 두 토큰은 HttpOnly 와 SameSite=Strict 쿠키로만 오간다.
        회전과 재사용 탐지, 로그아웃 시 valid-after 커트라인이 빠지지 않았는지 본다.
        인메모리 캐시 장애에서 인증 전체가 닫히지 않는지(통과시키는 경로) 본다.
        역할은 Role enum 하나가 단일 축이다. 트랙을 따로 두려 하면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [qa-security-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-security-guideline.md)

        - `SEC-1-01` 리소스 접근 시 소유권 또는 권한을 검증하는가
        - `SEC-1-02` 검증을 클라이언트가 보낸 식별자가 아니라 인증 주체 기준으로 하는가
        - `SEC-1-03` 목록 조회에서도 소유자 조건이 쿼리에 포함되는가

        근거 [domain-boundary-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/domain-boundary-guideline.md)

        - `DPB-3-04` 도메인마다 권한 검사를 따로 만들지 않고 `auth` 를 가져다 쓰는가

    # --- 테스트 ---------------------------------------------------------------
    - path: "src/test/java/**/*.java"
      instructions: |
        unit-testing-guideline.md(UT-)를 적용한다. 프로덕션 코드용 가이드(EJ-, 경계 규약)는
        여기 적용하지 않는다. 목 주입과 픽스처 빌더, 서술형 메서드명이 전부 지적으로 나온다.
        단위 테스트는 대상과 같은 패키지에 두고 이름은 ~Test 다.
        커버리지 게이트가 service 패키지 메서드 100% 를 요구한다(BLD-1-01).

        통합 테스트를 쓰라고 제안하지 않는다. 팀이 권장 대상에서 뺐다(가이드 5장).
        "실제 DB 로 확인하는 편이 낫다", "통합 테스트를 추가하라" 같은 지적을 만들지 않는다.
        mock 으로 DB 를 대신했다는 것만으로 지적하지 않는다. 쓸지 말지는 작성자가 판단한다.

        작성자가 통합 테스트를 쓴 경우에만 두 가지를 본다.
        @SpringBootTest 로 실제 컨텍스트를 띄웠는지(@DataJpaTest 나 @WebMvcTest 같은 슬라이스는
        쓰지 않는다), 이름이 ~IntegrationTest 로 끝나고 도메인 패키지 바로 아래에 있는지.
        그 테스트가 service 메서드를 지나며 커버리지를 채우고 있으면 지적한다(BLD-1-04).

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [unit-testing-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/unit-testing-guideline.md)

        - `UT-1-01` 회귀 방어: 테스트가 실제 버그를 잡아내는가
        - `UT-1-02` 리팩터링 내성: 동작이 그대로인데 내부 구현만 바꿔도 테스트가 깨지지 않는가
        - `UT-2-01` 결과나 상태 변화 등 외부에서 관찰 가능한 동작을 검증하는가
        - `UT-2-02` 내부 메서드 호출 순서나 횟수 같은 구현 세부를 검증하지 않는가
        - `UT-3-01` 준비(given), 실행(when), 검증(then) 단계가 구분되는가
        - `UT-3-02` 하나의 테스트가 하나의 동작 단위를 검증하는가
        - `UT-3-03` 테스트 이름이 어떤 상황에서 무엇을 기대하는지 드러내는가
        - `UT-3-04` 조건 분기나 반복 같은 로직을 테스트 안에 넣지 않는가
        - `UT-4-01` 들어오는 데이터를 제공하는 의존성은 stub으로 두고 검증 대상으로 삼지 않는가
        - `UT-4-02` 나가는 호출(부수 효과)을 검증할 때만 mock으로 검증하는가
        - `UT-4-03` 모든 의존성을 무분별하게 모킹하지 않는가
        - `UT-6-01` 테스트 코드의 가독성과 중복을 운영 코드만큼 신경 쓰는가
        - `UT-6-02` 테스트 간에 상태를 공유해 서로 영향을 주지 않는가
        - `UT-6-03` 커버리지 숫자 자체를 목표로 삼지 않는가
        - `UT-5-02` 통합 테스트를 쓸 때 `@SpringBootTest` 로 실제 컨텍스트를 띄우는가
        - `UT-5-03` 통합 테스트의 이름이 `~IntegrationTest` 로 끝나는가

    - path: "src/test/java/**/ArchitectureTest.java"
      instructions: |
        설계 문서 1.5절과 2.5절의 규칙 목록이 기준이다. 규칙을 더하거나 지웠으면 그 문서의
        표도 함께 고쳤는지 확인한다. 한쪽만 고치면 문서와 테스트가 어긋난다.
        검사 대상이 0개인 규칙은 allowEmptyShould(true) 가 필요하다. 없으면 도메인이 생기기 전에
        규칙이 실패해 끄게 된다.

    # --- 스키마와 빌드 ---------------------------------------------------------
    - path: "src/main/resources/db/migration/*.sql"
      instructions: |
        Flyway 규약은 평평한 단일 디렉터리와 V{번호}__{스네이크케이스}.sql 이다.
        이미 배포된 마이그레이션을 고치면 지적한다. 새 파일을 더한다.
        시간 컬럼의 기준 시간대는 Asia/Seoul 이고 날짜 함수(CURDATE, NOW)를 쓰지 않는다.
        영업일은 애플리케이션이 계산해 넣는다.
        도메인 간 연관은 FK 가 아니라 ID 컬럼이다.

        이 경로에서는 [설계] 항목 여섯을 쓴다. 파일 하나로 판정되기 때문이다.
        DI-3-01 유일성이 필요한 값에 UNIQUE 가 있는지,
        DI-3-02 값 범위 규칙이 CHECK 로 표현되어 있는지,
        DI-3-03 같은 도메인 안의 참조에 외래 키가 있는지(도메인 간은 ID 컬럼이므로 대상이 아니다),
        DI-3-04 NOT NULL 이 필요한 컬럼에 지정되어 있는지,
        PERF-2-03 조회 조건에 맞는 인덱스가 있는지(실제로 타는지는 EXPLAIN 이 필요해 보지 않는다),
        CMP-5-02 컬럼 제거를 단계로 나눴는지 본다.

        CMP-5-01 은 [프로세스] 라 쓰지 않는다. 배포와 스키마 변경의 롤백 가능성은 기록을 봐야
        판정된다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [qa-data-integrity-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-data-integrity-guideline.md)

        - `DI-3-01` 유일성이 필요한 값에 UNIQUE 제약이 있는가
        - `DI-3-02` 값 범위 규칙이 CHECK 제약으로도 표현되어 있는가
        - `DI-3-03` 참조 무결성이 필요한 곳에 외래 키가 있는가
        - `DI-3-04` NOT NULL이 필요한 컬럼에 지정되어 있는가

        근거 [qa-performance-efficiency-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-performance-efficiency-guideline.md)

        - `PERF-2-03` 조회 조건에 맞는 인덱스가 있고 실제로 타는가

        근거 [qa-compatibility-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-compatibility-guideline.md)

        - `CMP-5-02` 컬럼 제거를 단계로 나눴는가

    # --- 실행 설정. 여기서만 [인프라] 항목을 쓴다 ---------------------------------
    - path: "src/main/resources/*.yml"
      instructions: |
        품질 속성의 [인프라] 항목 여덟을 쓴다. 파일 하나로 판정되는 것만 열었다.
        REL-2-03 DB 커넥션 획득과 쿼리 실행에 타임아웃이 있는지,
        REL-2-09 실패율 임계치로 호출을 끊는 설정이 있는지,
        REL-5-02 readiness 와 liveness 가 분리되어 있는지,
        REL-5-03 종료 시 처리 중인 요청을 마치는 설정이 있는지,
        REL-5-04 liveness 가 외부 의존성 상태에 좌우되지 않는지,
        SEC-3-05 요청 본문 크기 상한이 있는지,
        OBS-3-01 운영 로그가 구조화된 형식으로 남는지,
        OBS-4-01 기본 지표가 노출되는지 본다.

        값의 적정성은 보지 않는다. 설정이 있는지 없는지만 본다. 임계치는 대부분 등급 C 이고
        실측으로 확정할 값이라 주석에 그 뜻이 적혀 있다.

        REL-2-02 와 REL-2-08 은 열지 않았다. 상위 호출자의 타임아웃 예산을 알아야 판정되므로
        이 파일 하나로는 답할 수 없다.

        시간대 관련 설정은 Asia/Seoul 고정이다. UTC 로 바꾸면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [qa-reliability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-reliability-guideline.md)

        - `REL-2-03` DB 커넥션 획득과 쿼리 실행에도 타임아웃이 있는가
        - `REL-2-09` 실패율이 임계치를 넘으면 호출을 끊고 빠르게 실패하는가
        - `REL-5-02` 기동 완료 전에 트래픽을 받지 않는가 (readiness와 liveness 분리)
        - `REL-5-03` 종료 시 처리 중인 요청을 마치고 내려가는가 (graceful shutdown)
        - `REL-5-04` liveness가 외부 의존성 상태에 좌우되지 않는가

        근거 [qa-security-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-security-guideline.md)

        - `SEC-3-05` 요청 본문 크기 상한이 설정되어 있는가

        근거 [qa-observability-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/software-quality/qa-observability-guideline.md)

        - `OBS-3-01` 구조화된 형식(JSON)으로 남는가
        - `OBS-4-01` RED 또는 USE 관점의 기본 지표를 노출하는가

    - path: "src/main/resources/logback-spring.xml"
      instructions: |

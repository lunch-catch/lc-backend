        - `OBS-4-01` RED 또는 USE 관점의 기본 지표를 노출하는가

    - path: "build.gradle"
      instructions: |
        build-gate-guideline.md(BLD-)를 적용한다. 커버리지 대상이
        com.launchcatch.*.service.* 로 좁혀져 있는지, check 가
        jacocoTestCoverageVerification 과 coverageDataCheck 를 부르는지 본다.
        시험 JVM 시간대는 Asia/Seoul 고정이다. UTC 로 바꾸면 지적한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [build-gate-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/build-gate-guideline.md)

        - `BLD-1-01` JaCoCo 대상이 `com.launchcatch.*.service.*`로 좁혀져 있는가
        - `BLD-1-02` 판정 단위가 클래스별(`element = 'CLASS'`), 카운터가 메서드(`counter = 'METHOD'`)인가
        - `BLD-1-03` 기준이 `minimum = 1.00`인가
        - `BLD-1-04` 통합 테스트로 커버리지를 채우지 않는가
        - `BLD-1-05` `check`가 `jacocoTestCoverageVerification`과 `coverageDataCheck`에 의존하는가
        - `BLD-1-06` `jacocoTestReport`가 `sonar` 태스크보다 먼저 도는가
        - `BLD-1-07` 검증 대상 클래스가 있는데 실행 데이터가 없는 상태를 막는가

    # 이 파일이 조용히 망가지는 것을 막는 자리다. 리뷰 설정이 틀리면 아무것도 빨개지지 않고
    # 리뷰만 멈춘다. GitHub 도 게이트도 이것을 막지 못한다.
    - path: ".coderabbit.yaml"
      instructions: |
        리뷰 설정이 꺼지거나 좁아지는 변경을 지적한다.
        base_branches 에서 develop 이 빠지면 기능 브랜치가 리뷰 없이 develop 에 들어간다.
        기본 브랜치(main)는 이 목록과 무관하게 항상 리뷰되므로 거기에 적지 않는 것이 맞다.
        auto_review.enabled 를 끄거나 path_filters 로 src 를 제외하는 변경도 같다.
        리뷰를 건너뛰는 수단을 들이는 변경은 지적한다. ignore_title_keywords, labels,
        ignore_usernames, description_keyword 가 그것이다. 필터는 base 와 head 를 함께
        보지 못해서, main 쪽을 끄면 release/* 와 hotfix/* 의 유일한 리뷰 기회가 함께 꺼진다.
        knowledge_base.code_guidelines.filePatterns 는 반드시 files 와 applyTo 를 쓰는
        객체 형태여야 한다. 문자열 항목은 그 가이드를 자기 디렉터리 안에만 적용한다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [build-gate-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/build-gate-guideline.md)

        - `BLD-3-04` CodeRabbit 의 `reviews.auto_review.base_branches` 에 `develop` 이 있는가
        - `BLD-3-05` 자동 리뷰를 건너뛰는 수단을 두지 않았는가

    - path: ".github/workflows/**"
      instructions: |
        build-gate-guideline.md(BLD-)를 적용한다. 병합을 막는 것은 G-BUILD 뿐이다.
        LLM 판정이나 리뷰 상태를 차단 조건으로 만들면 지적한다.
        액션은 버전을 고정해 쓴다.

        main 의 병합 출처를 확인하는 스텝을 지우거나 조건을 넓히면 지적한다. 이 가드는
        GitHub 설정으로 대신할 수 없어서(브랜치 보호에 base 제한 항목이 없다) 이 파일이
        유일한 자리다. 그래서 게이트가 자기 자신을 지키지 못한다.

        브랜치 보호의 필수 상태 검사 목록을 묻는 항목은 쓰지 않는다. 그 목록은 저장소
        설정이라 어느 파일에도 없어서 diff 로 판정할 수 없다. 사람이 설정 화면에서 본다.

        판정하지 않는 스텝이 잡을 실패시킬 수 있는지 본다. 리포트 업로드나 알림처럼 결과를
        보기 편하게 하는 스텝에 continue-on-error 가 없으면 지적한다. 외부 서비스가 흔들릴 때
        코드와 무관하게 병합이 막힌다.

        이 경로에서 쓸 항목이다. 지적할 때 근거를 아래 모양으로 붙인다.
        문서별로 묶고 해당 문서의 항목만 가운데점 없는 목록으로 나열한다.
        문서 이름은 링크로 걸고 전체 경로를 적지 않는다. 번호와 문장을 고쳐 쓰지 않는다.

        근거 [build-gate-guideline.md](https://github.com/lunch-catch/lc-backend/blob/main/docs/code-convention/build-gate-guideline.md)

        - `BLD-2-01` SonarQube Quality Gate가 커버리지를 판정하지 않는가
        - `BLD-2-02` 정적 분석 차단 조건이 신규 `Blocker` 이슈 0건인가
        - `BLD-2-05` 판정하지 않는 스텝이 게이트를 막지 않는가
        - `BLD-3-02` `main` 으로 가는 PR 의 출처를 `develop`, `release/*`, `hotfix/*` 로 제한하는가

  tools:
    # 한국어 산문에 영어 기준 지적이 쏟아진다. 문서 규칙은 CLAUDE.md 가 소유한다
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # 자바 정적 분석은 SonarQube 가 소유한다(BLD-2-01, BLD-2-02). 두 벌이면 같은 사안을 두 번 본다
    pmd:
      enabled: false
    # 코틀린 전용이고 이 저장소에 코틀린이 없다
    detekt:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # CLAUDE.md 는 기본으로 잡힌다. 나머지를 명시한다.
    #
    # 반드시 files 와 applyTo 를 쓰는 객체 형태로 적는다. 문자열 항목은 그 가이드를
    # "자기가 담긴 디렉터리와 하위 디렉터리" 에만 적용한다. docs/code-convention/*.md 를
    # 문자열로 적으면 docs/code-convention 안의 파일을 리뷰할 때만 참조되고,
    # src/main/java 를 리뷰할 때는 가이드가 아예 연결되지 않는다.
    #
    # 파일 이름은 대소문자를 가린다. files 와 applyTo 모두 콤마로 여러 글롭을 받는다
    filePatterns:
      # 리뷰 규약 진입점. 봇 동작 규칙과 인용 형식을 담아 모든 변경에 적용한다
      - files: "docs/CODEREVIEW.md"
        applyTo: "**"

      # 코드 관용과 패턴. 자바와 자원, 빌드 설정에 적용한다
      - files: "docs/code-convention/*-guideline.md"
        applyTo: "src/**,build.gradle,.github/workflows/**,compose.yaml"

      # 품질 속성. 같은 범위에 적용한다. [코드] 항목이 주된 대상이고
      # [설계] 와 [인프라] 는 path_instructions 가 열어 준 경로에서만 쓴다
      - files: "docs/software-quality/qa-*-guideline.md,docs/software-quality/quality-attributes.md"
        applyTo: "src/**,build.gradle,.github/workflows/**,compose.yaml"

      # 경계 규약의 설명. 프로덕션 자바에만 적용한다
      - files: "docs/architecture/*.md"
        applyTo: "src/main/java/**"

      # API 공통 규약. 컨트롤러와 응답 포맷에 적용한다
      - files: "docs/api-spec/*.md"
        applyTo: "src/main/java/**/controller/**,src/main/java/**/global/response/**,src/main/java/**/global/exception/**"

code_generation:
  docstrings:
    # 사전 점검은 껐지만 사람이 생성 기능을 쓸 때 영어 문서가 섞이지 않게 한다
    language: ko-KR

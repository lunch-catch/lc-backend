# PR 게이트. 병합을 막는 유일한 코드 게이트다 (BLD-1-05, BLD-2-02).
#
# 판정은 전부 결정론적이다. 커버리지와 정적 분석만 보고, 사람 판단이 필요한 것은 리뷰에 남긴다.
# 규약은 docs/code-convention/build-gate-guideline.md 에 있다.
#
# LLM 코드 리뷰는 CodeRabbit 이 맡고 이 워크플로와 무관하다. 설정은 루트의 .coderabbit.yaml 에 있다.
# 그쪽은 지적만 남기고 차단하지 않는다(request_changes_workflow 와 commit_status 를 껐다).
# 재현율이 측정되지 않은 판정으로 병합을 막으면 오탐이 쌓여 우회 문화가 생긴다.

name: PR 게이트

on:
  pull_request:
    branches: [main, develop]
    # synchronize 는 PR 이 열린 뒤의 push, reopened 는 닫힌 동안 움직인 base 를 위한 것이다
    types: [opened, synchronize, reopened]
  # merge queue 가 만든 임시 브랜치에서도 돌아야 한다. 이 트리거가 없으면 큐에 들어간 PR 이
  # G-BUILD 를 영원히 기다린다. 큐를 켜기 전에 이 줄이 기본 브랜치에 들어가 있어야 한다.
  merge_group:

# PR 이벤트는 같은 PR 에 push 가 이어지면 앞선 실행을 취소한다.
#
# merge_group 에는 pull_request 가 없어 번호가 빈다. 그대로 두면 큐 항목 전부가 한 그룹에
# 묶여 서로를 취소하고, 큐가 영원히 통과하지 못한다. 그래서 큐에서는 head_sha 로 가른다.
# 큐 항목은 각자 다른 조합을 검증하므로 취소 대상이 아니다.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: G-BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # main 으로 가는 PR 은 develop, release/*, hotfix/* 에서만 받는다 (BLD-2-05).
      # GitHub 의 브랜치 보호에는 base 를 제한하는 항목이 없고 조직 룰셋은 Team 플랜이
      # 필요하므로 여기서 막는다. 체크아웃보다 앞에 두어 바로 떨어지게 한다.
      #
      # merge_group 에는 head_ref 가 없어 출처를 볼 수 없다. 큐는 develop 에만 켜므로
      # main 으로 가는 PR 은 이 조건이 항상 pull_request 이벤트에서 평가된다.
      - name: main 의 병합 출처 확인
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|release/*|hotfix/*)
              echo "출처 $HEAD_REF 는 허용된다." ;;
            *)
              echo "::error::main 으로 가는 PR 은 develop, release/*, hotfix/* 에서만 받는다. 지금 출처는 $HEAD_REF 다. 기능 브랜치는 develop 으로 올린다."
              exit 1 ;;
          esac

      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # SonarQube 가 신규 코드를 가리려고 blame 을 읽으므로 전체 이력이 필요하다
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # check 는 test, jacocoTestCoverageVerification, coverageDataCheck 를 부른다.
      # 커버리지 기준은 com.launchcatch.*.service.* 의 메서드 100% 다.
      # 통합 테스트를 쓰면 Testcontainers 가 MySQL 8.4 와 Valkey 9 를 띄우므로 러너의 도커가 필요하다.
      - name: 테스트와 커버리지
        run: ./gradlew check --no-daemon

      # SONAR_TOKEN 이 없으면 건너뛴다. 토큰을 넣기 전에도 커버리지 게이트는 돌아야 한다.
      #
      # merge_group 에서는 돌리지 않는다. 아래 Blocker 확인이 PR 번호로 조회하는데 큐
      # 이벤트에는 그 번호가 없다. 큐 실행이 확인할 것은 "최신 base 와 합쳐도 테스트와
      # 커버리지가 통과하는가" 다.
      #
      # 정적 분석은 PR 실행이 맡는다. 단 SONAR_TOKEN 이 없으면 PR 실행도 건너뛰므로,
      # 그 상태에서는 신규 Blocker 를 아무도 보지 않는다. 토큰이 있어야 성립하는 분담이다.
      - name: 정적 분석
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon

      # sonar 태스크는 분석 결과를 올리기만 하고 성공으로 끝난다. 차단은 여기서 한다.
      #
      # sonar.qualitygate.wait 을 쓰지 않는 이유는 무료 플랜이 내장 게이트 Sonar way 만
      # 쓸 수 있어서다. 거기에는 "신규 코드 커버리지 80% 이상" 이 들어 있어, Gradle 의
      # 서비스 계층 100% 기준과 커버리지 판정 주체가 둘이 된다 (BLD-2-01).
      # 커스텀 게이트로 그 조건을 빼려면 Team 플랜이 필요하다.
      # 이슈 검색 API 는 무료 플랜에서도 되므로 신규 Blocker 만 직접 센다 (BLD-2-02).
      - name: 신규 Blocker 0건 확인
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          KEY=lunch-catch_lc-backend

          # 프로젝트 키가 틀리면 아래 이슈 검색이 오류 없이 total=0 을 돌려준다.
          # 그러면 Blocker 가 있어도 이 단계가 통과해 거짓 초록이 된다.
          # 그래서 프로젝트가 실재하는지 먼저 확인하고 없으면 여기서 막는다
          if ! curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/components/show?component=$KEY" \
               | jq -e '.component.key' >/dev/null 2>&1; then
            echo "::error::SonarCloud 에 프로젝트 $KEY 가 없다. build.gradle 의 sonar.projectKey 와 이 값을 맞춘다."
            exit 1
          fi

          Q="componentKeys=$KEY&severities=BLOCKER&resolved=false&ps=100&pullRequest=$PR"
          RES=$(curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?$Q")
          N=$(printf '%s' "$RES" | jq -r '.total // "err"')
          echo "신규 Blocker ${N}건"
          if [ "$N" = "err" ]; then
            echo "::error::이슈 조회에 실패했다. 응답: $(printf '%s' "$RES" | head -c 300)"
            exit 1
          fi
          if [ "$N" != "0" ]; then
            printf '%s' "$RES" | jq -r '.issues[] | "::error file=\(.component | sub("^[^:]*:"; "")),line=\(.line // 1)::\(.message)"'
            echo "신규 Blocker 가 남아 있어 병합을 막는다."
            exit 1
          fi

      - name: 정적 분석을 건너뛴 이유
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN 이 없어 정적 분석을 건너뛰었다. 저장소 Secrets 에 등록해야 한다."

      # 판정하지 않는 스텝이다. 깨진 빌드의 원인을 로컬 재현 없이 보려고 올려 둔다 (BLD-2-05).
      #
      # 실패했을 때만 올린다. 통과한 빌드의 리포트는 볼 일이 없고, 커버리지는 SonarCloud 가
      # 이미 보여 준다. 성공 경로에서 169개 파일을 매번 올리면 외부 서비스에 기댈 일만 늘어난다.
      #
      # continue-on-error 를 둔 이유는 이것이 실패해도 게이트가 막아서는 안 되기 때문이다.
      # 2026-10-03 에 아티팩트 서비스가 CreateArtifact 를 5회 타임아웃해서, 테스트와 커버리지와
      # 정적 분석이 모두 통과한 PR 의 병합이 막혔다. 차단 조건은 커버리지와 신규 Blocker 와
      # 병합 출처 셋이고 파일 업로드는 거기 없다.
      - name: 테스트 리포트
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

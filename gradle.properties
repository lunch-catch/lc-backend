# 빌드 캐시를 켠다. CI 는 gradle/actions/setup-gradle 이 캐시를 저장하고 복원한다.
# 테스트는 입력이 바뀌어 다시 돌지만 컴파일과 QueryDSL Q클래스 생성 같은 앞단은 건너뛴다.
org.gradle.caching=true

# 태스크를 서로 의존하지 않는 범위에서 함께 돌린다. 단일 모듈이라 효과는 작지만 비용도 없다.
org.gradle.parallel=true

# 설정 캐시는 켜지 않는다. sonarqube 플러그인이 아직 호환되지 않아 PR 게이트의 정적 분석이 떨어진다.
# org.gradle.configuration-cache=true

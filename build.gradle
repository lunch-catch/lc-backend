plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.launchcatch'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly.extendsFrom annotationProcessor
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /*
     * 로드 밸런서가 /actuator/health/readiness 를 찌르고 Prometheus 가 /actuator/prometheus 를 긁는다
     *. 이 의존성이 없으면 인스턴스가 healthy 가 되지 않는다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 버전은 Boot 4.0.5 의 BOM 이 관리한다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    /*
     * 로컬(JVM) 캐시. 인스턴스 사이에 공유할 필요가 없고 값이 한동안 불변인 조회에 쓴다.
     * ops 의 플랫폼 설정값이 refreshAfterWrite 로 재배포 없이 바뀌는 자리이고,
     * 인메모리 캐시(Valkey)는 인스턴스 간 공유와 원자적 회전이 필요한 쪽을 맡는다.
     * 버전은 Boot BOM 이 관리한다.
     */
    implementation 'com.github.ben-manes.caffeine:caffeine'

    /*
     * 외부 호출과 인메모리 캐시 호출에 회로를 건다.
     * 11:00 선착순 발급과 결제 승인 콜백이 장애 때 처음 도는 경로라
     * 상태 전이(닫힘 -> 열림 -> 반열림)와 슬라이딩 윈도우 집계를 직접 짜는 위험을 안 지는 편이 낫다.
     * Boot BOM 이 관리하지 않아 버전을 직접 적는다.
     */
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'

    /*
     * 역할 기반 인가. 메서드 단위 보안으로 API 별 접근을 제어한다.
     * 서버 세션을 두지 않고 토큰을 쿠키로 주고받는다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-security'

    /*
     * 사용자 로그인(카카오 OIDC). ClientRegistration 과 ClientRegistrationRepository 는
     * spring-security-oauth2-client 가, id_token 검증(NimbusJwtDecoder, JwtException)은
     * spring-security-oauth2-jose 가 준다. 이 스타터가 둘을 함께 끌어온다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /*
     * 인메모리 캐시(Valkey). 여기 있는 것이 많다.
     * Refresh Token 회전(CAS Lua 스크립트)과 Access Token valid-after 커트라인,
     * 선착순 발급 순번, serve 기록 30분, 당일 소진 카운터와 시간대별 목표,
     * 피드 속도 제한 분당 2회.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /*
     * JwtTokenProvider 가 io.jsonwebtoken(JJWT) 0.12.x 플루언트 API 를 쓴다.
     * api 는 컴파일 타임에, impl 과 jackson 은 런타임에만 필요하다(서명 클레임 직렬화에 Jackson).
     * 동적 QR 의 서명 토큰도 같은 라이브러리를 쓴다.
     */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    /*
     * Boot 4 는 자동설정을 기술별 모듈로 쪼갰다.
     * flyway-core 만 있으면 FlywayAutoConfiguration 이 붙지 않아 마이그레이션이 조용히 건너뛴다.
     */
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    /*
     * BOM 밖이라 버전을 직접 고정한다.
     * 3.0.3 이 Boot 4.0.5 를 parent 로 빌드된 것이다.
     */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    /*
     * 외부 API 호출 로깅(ExternalApiLoggingExchangeFilter, TraceIdExchangeFilter)이
     * WebClient 의 ExchangeFilterFunction 을 구현한다. MVC 서버라도 이 타입을 쓰려면
     * 리액티브 웹 모듈이 클래스패스에 있어야 한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    /*
     * Boot 4 가 아웃바운드 WebClient 자동구성(WebClientAutoConfiguration,
     * org.springframework.boot.webclient.WebClientCustomizer)을 spring-boot-webflux 와
     * 별도 모듈(spring-boot-webclient)로 쪼개 놓았다. 위 webflux 스타터만으로는 이 모듈이
     * 끌려오지 않는다. WebClientConfig 의 공통 타임아웃, 풀, 필터가 실제로 걸리려면 필요하다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-webclient'

    /*
     * 외부 API 서킷브레이커(카카오 OIDC 로그인, 지도, 결제대행, 로컬 LLM).
     * Boot 4 는 spring-boot3 용과 나뉜 전용 아티팩트가 있다.
     */
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

    /*
     * 파일 업로드. S3Presigner 로 업로드 URL 을 발급하고 HeadObject 로 실제 업로드를 확인한다.
     * 증빙 서류(사업자등록증, 영업신고증)는 관리자와 해당 점주만 10분 Presigned URL 로 본다.
     * 가게 이미지와 대표 메뉴, 포스터 이미지도 같은 경로를 쓴다.
     *
     * Java SDK v2 에 presigned POST 생성이 없어 PUT 만 쓴다. 그래서 s3 모듈 하나로 충분하다.
     * s3 모듈은 동기 HTTP 클라이언트를 직접 들여오지 않으므로(전이 의존은 비동기용 netty-nio-client 뿐)
     * S3Client 에 연결 타임아웃을 명시하려면 apache5-client 가 필요하다.
     */
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache5-client'

    /*
     * @Scheduled 메서드 공통 로깅(SchedulerLoggingAspect)과 관리 행위 감사 로그가
     * 애노테이션 포인트컷(@annotation(...))을 쓴다. spring-aop 자체는 spring-data-jpa 가
     * @Transactional 프록시 때문에 이미 들여오지만, AspectJ 애노테이션 스타일 포인트컷을 실제로
     * 짜려면 aspectjweaver 가 클래스패스에 있어야 한다. 없으면 @Aspect 빈이 등록만 되고
     * 조용히 아무 효과도 내지 않는다.
     */
    implementation 'org.aspectj:aspectjweaver:1.9.22'

    // logback-spring.xml 의 prod 프로필이 JSON 라인으로 로그를 남긴다(Loki 가 파싱하기 쉽도록).
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    /*
     * QueryDSL 버전은 Boot 4.0.5 의 BOM 이 5.1.0 으로 관리한다.
     * jakarta 분류자를 빼면 javax.persistence 변형이 걸려 Boot 4 에서 깨진다.
     */
    implementation 'com.querydsl:querydsl-jpa::jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    /*
     * bootRun 이 compose.yaml 의 MySQL 과 Valkey 를 자동으로 띄우고 접속 정보를 주입한다.
     * developmentOnly 라 bootJar 에는 들어가지 않는다.
     */
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /*
     * 테스트 소스셋에도 Lombok 을 건다.
     * compileOnly.extendsFrom annotationProcessor 는 main 소스셋만 해당해서,
     * 걸지 않으면 테스트 픽스처에 Lombok 을 쓰는 순간 컴파일이 깨진다.
     */
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    /*
     * 통합 테스트용이다. 팀은 통합 테스트를 권장하지 않지만, 필요하다고 판단해 쓸 때는
     * @SpringBootTest 로 실제 컨텍스트를 띄우고 외부 인프라까지 붙인다
     * (unit-testing-guideline.md 5장). 그때 Gradle 을 손보지 않아도 되게 여기 둔다.
     *
     * 인메모리 DB 는 쓰지 않는다. 운영과 같은 mysql:8.4 와 valkey 9 를 띄운다.
     * MockMvc 지원(@AutoConfigureMockMvc)은 Boot 4 에서 spring-boot-starter-test 에서 빠져
     * spring-boot-starter-webmvc-test 로 갔다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    /*
     * Boot 4.0.5 의 BOM 이 Testcontainers 2.0.4 를 관리한다.
     * 2.x 에서 산출물 이름에 testcontainers- 접두사가 붙었다. 1.x 좌표(junit-jupiter, mysql)는 해석되지 않는다.
     */
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

/*
 * bootJar 만 만든다.
 * 의존성이 빠진 plain jar 가 함께 있으면 Dockerfile 의 COPY *.jar 가 무엇을 담을지 글롭 순서에 좌우된다.
 * 잘못 담기면 기동 시점에야 드러난다.
 */
tasks.named('jar') {
    enabled = false
}

/*
 * 로컬 비밀값이 배포 산출물에 실리지 않게 막는다.
 * application-local.yml 은 카카오 키와 JWT 서명 키를 담고 src/main/resources 아래에 있어서,
 * 두면 jar 에 그대로 들어가고 컨테이너 이미지까지 따라간다.
 * .gitignore 는 커밋만 막지 빌드는 못 막는다.
 *
 * processResources 가 아니라 bootJar 에서 뺀다.
 * 이 파일은 클래스패스에 있어야 bootRun 이 읽으므로 build/resources/main 에는 남겨야 한다.
 */
tasks.named('bootJar') {
    exclude '**/application-local.yml'
}

/*
 * 시험 JVM 을 Asia/Seoul 로 고정한다.
 *
 * 애플리케이션과 DB 드라이버와 DB 세션의 시간대를 Asia/Seoul 로 통일한다.
 * 영업일(business_date)과 모든 시각을 애플리케이션이 Clock 빈으로 계산해 넣고 관계형 DB 의
 * 날짜 함수(CURDATE, NOW)는 쓰지 않는다. 시험 JVM 만 다른 시간대면 00:00 과 09:00(UTC 자정)
 * 경계 시험이 운영과 다른 환경에서 도는 셈이 되어, 정작 잡아야 할 경계 버그를 놓친다.
 *
 * 드라이버는 LocalDateTime 을 존 없는 벽시계로 그대로 보내고 Timestamp 만 connectionTimeZone 으로
 * 변환한다. 양쪽을 같은 시간대로 맞추면 그 변환이 항등이 되어 심는 쪽과 재는 쪽이 갈리지 않는다.
 */
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
}

/*
 * docs/erd 의 ERD 문서를 다시 뽑는다. 마이그레이션을 고친 뒤에 돌린다.
 *
 * check 에 걸지 않는다. 빌드가 작업 트리를 더럽히면 git status 가 매번 지저분해지고 그 상태로
 * 커밋하는 사람이 생긴다. 어긋남은 ErdDocumentationIntegrationTest 가 test 안에서 잡으므로
 * 게이트는 이미 지켜진다. 이 태스크는 고치는 수단이다.
 *
 * 실제 MySQL 에 마이그레이션을 적용한 뒤 information_schema 에서 읽으므로 도커가 필요하다.
 */
tasks.register('generateErd', Test) {
    group = 'documentation'
    description = 'docs/erd 의 도메인별 ERD 를 마이그레이션에서 다시 생성한다'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
    systemProperty 'erd.write', 'true'
    filter {
        includeTestsMatching 'com.launchcatch.global.config.ErdDocumentationIntegrationTest'
    }
    /*
     * 산출물이 저장소 파일이라 Gradle 의 up-to-date 판정에 맡기면 스키마를 고친 뒤에도
     * 건너뛴다. 이 태스크는 사람이 부를 때만 돌고 항상 다시 돌아야 한다.
     */
    outputs.upToDateWhen { false }
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    /*
     * 게이트와 같은 실행 데이터를 읽는다.
     * 다르면 Sonar 수치와 차단 기준이 어긋나 어느 쪽이 진짜인지 헷갈린다.
     */
    executionData.setFrom fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec')
    reports {
        // SonarQube 가 읽는 형식이다
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    /*
     * 단위 테스트의 .exec 만 읽는다 (BLD-1-04).
     * 통합 테스트를 합산하면 서비스 로직을 단위 테스트 없이 통과시킬 수 있다.
     * 통합 테스트는 계층을 가로질러 실행되므로 메서드를 지나가기만 해도 커버리지가 채워진다.
     */
    executionData.setFrom fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec')
    violationRules {
        rule {
            /*
             * includes 로 좁히므로 exclude 목록이 필요 없다.
             * contract, controller, repository, entity, Q클래스, config 가 자동으로 빠진다 (BLD-1-01).
             * 설계 문서 1.3 절이 업무 로직을 도메인의 service 패키지에 두게 했으므로 그 패키지를
             * 대상으로 삼는다. 하위 패키지로 나뉜 도메인(adserving.engine 등)도 * 가 점을 넘어
             * 함께 걸린다.
             */
            element = 'CLASS'
            includes = ['com.launchcatch.*.service.*']
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.00
            }
        }
    }
}

/*
 * jacocoTestCoverageVerification 은 .exec 가 하나도 없으면 Gradle 이 통째로 건너뛴다.
 * 검증 대상 클래스가 있는데 건너뛴 것이 초록으로 보이면 게이트가 없는 것과 같다.
 * 테스트를 하나도 안 쓰면 무사통과하고 하나라도 쓰면 100% 를 요구하는, 거꾸로 걸린 게이트가 된다.
 * 그래서 대상 클래스의 존재와 실행 데이터의 존재를 따로 확인한다 (BLD-1-07).
 */
tasks.register('coverageDataCheck') {
    description = '커버리지 검증 대상이 있는데 실행 데이터가 없는 상태를 막는다'
    group = 'verification'
    dependsOn tasks.named('test')

    def targets = fileTree(layout.buildDirectory.dir('classes/java/main')) {
        include '**/service/*.class'
    }
    // 게이트가 읽는 것과 같은 파일을 본다
    def execFiles = fileTree(layout.buildDirectory.dir('jacoco')) {
        include 'test.exec'
    }

    inputs.files(targets, execFiles)
    doLast {
        if (targets.isEmpty()) {
            logger.lifecycle('커버리지 검증 대상 없음. service 패키지 클래스가 아직 없다')
            return
        }
        if (execFiles.filter { it.exists() }.isEmpty()) {
            throw new GradleException(
                    "커버리지 검증 대상이 ${targets.files.size()}개 있는데 실행 데이터가 없다.\n" +
                    '테스트가 하나도 없으면 jacocoTestCoverageVerification 이 건너뛰어 통과처럼 보인다.\n' +
                    '대상: ' + targets.files.collect { it.name }.sort().join(', '))
        }
    }
}

// BLD-1-05
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'),
            tasks.named('coverageDataCheck')
}

// BLD-1-06: 순서가 바뀌면 SonarQube 에 커버리지가 0 으로 표시된다
tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

sonar {
    properties {
        property 'sonar.projectKey', 'lunch-catch_lc-backend'
        property 'sonar.organization', 'lunch-catch'
        property 'sonar.host.url', 'https://sonarcloud.io'
        /*
         * 커버리지 판정은 Gradle 이 한다. Sonar 는 버그와 취약점만 본다 (BLD-2-01).
         * 이 경로는 판정용이 아니라 대시보드 표시용이다.
         */
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path

        /*
         * sonar.qualitygate.wait 을 켜지 않는다.
         * 켜면 내장 게이트 Sonar way 로 판정하는데, 거기에 "신규 코드 커버리지 80% 이상" 이
         * 들어 있어 Gradle 의 서비스 계층 100% 기준과 판정 주체가 둘이 된다 (BLD-2-01).
